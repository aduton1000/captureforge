# ═══════════════════════════════════════════════════════════════════════════
#  CaptureForge — pinned conda/mamba environment
#  Create:  mamba env create -f env/captureforge.yml
#  Apple Silicon: bioconda lacks osx-arm64 builds for some tools (genmap,
#  bwa-mem2). Create the env under Rosetta for full coverage:
#     CONDA_SUBDIR=osx-64 mamba env create -f env/captureforge.yml
#  (the report documents which stages run x86-emulated). Linux/HPC is native.
# ═══════════════════════════════════════════════════════════════════════════
name: captureforge
channels:
  - conda-forge
  - bioconda
dependencies:
  # ---- core CLIs ----
  - bedtools=2.31.1
  - samtools=1.21
  - htslib=1.21
  - seqkit=2.8.2
  - bowtie2=2.5.4
  - bwa-mem2=2.2.1
  - genmap=1.3.0
  - blast=2.16.0           # provides dustmasker
  - primer3=2.6.1          # CLI (primer3_core)
  - viennarna=2.6.4        # optional secondary-structure ΔG
  # ---- python + libs ----
  - python=3.11
  - pip=24.2
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.2.2
  - openpyxl=3.1.5
  - pysam=0.22.1
  - biopython=1.84
  - pyfaidx=0.8.1.1
  - primer3-py=2.0.3
  - jinja2=3.1.4
  - matplotlib-base=3.9.2
  - plotly=5.24.1          # interactive HTML embeds only; static PNG/SVG come from matplotlib
  - graphviz=14.1.2        # `dot` for the polished pipeline DAG (make_dag.py)
  - python-graphviz=0.21   # python bindings for the DAG
  - pyyaml=6.0.2
  - pip:
      - intervaltree==3.1.0
