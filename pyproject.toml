[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "captureforge"
version = "0.1.0"
description = "CaptureForge — unified CLI front door for the hybridization-capture probe/bait design pipeline."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Bright Adu" }]
keywords = ["genomics", "bioinformatics", "hybridization-capture", "probe-design", "bait-design", "nextflow"]

# The CLI is stdlib-only (argparse). It is a thin front door; the pipeline's real runtime
# dependencies live in the conda env (env/*.yml) / containers, which Nextflow activates.
dependencies = []

[project.scripts]
# registers the `captureforge` command on PATH after `pip install -e .`
captureforge = "captureforge_cli.cli:main"

[tool.setuptools]
packages = ["captureforge_cli"]
